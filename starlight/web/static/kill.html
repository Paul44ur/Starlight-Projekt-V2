<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Starlight kill switch</title>
<link rel="icon" href="/kill-icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/kill-icon-180.png" />
<link rel="manifest" href="/kill.webmanifest" />
<meta name="theme-color" content="#b3231d" data-fixed />
<link rel="stylesheet" href="/style.css" />
<script src="/i18n.js"></script>
<style>
  /* The kill switch keeps its own fixed red identity in every look: the page's theme colour, the
     home-screen icon and this big button are one red that a person learns to find in a hurry.
     Square (radius 2) and in the Paper type like the other pages; the red comes from --danger. */
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         min-height: 100%; padding: var(--s-5); text-align: center; gap: var(--s-4); }
  #stop { width: min(86vw, 360px); height: min(60vw, 240px); border-radius: var(--r-2); font-size: 32px;
          font-weight: 700; font-family: var(--font-display); color: var(--on-danger); background: var(--danger);
          border: 6px solid color-mix(in srgb, var(--danger) 55%, var(--bg)); box-shadow: none; }
  #stop:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
  #stop.done { background: var(--panel2); color: var(--text); border: 1px solid var(--text); }
  #state { font-size: var(--fs-lg); min-height: 2.6em; max-width: 30em; }
  /* the name above the button: whose switch this is */
  .lockup { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: var(--s-2);
            margin: 0; font-size: var(--fs-xl); font-weight: 600; }
  .lockup .dim { font-weight: 400; font-style: italic; }
</style>
</head>
<body>
<h1 class="lockup"><span>Starlight</span><span class="dim">Kill switch</span></h1>
<button id="stop" type="button">STOP<br />everything</button>
<p id="state" role="status" aria-live="assertive">One press stops everything Starlight is doing on the PC, until you resume there.</p>
<p class="small dim">Add this page to your home screen for a one-tap kill switch. <a href="/">Back to the chat</a></p>
<script src="/common.js"></script>
<script>
const stop = document.getElementById("stop"), state = document.getElementById("state");
async function show() {
  try {
    const s = await api("/api/status");
    if (s.kill.engaged) {
      stop.classList.add("done"); stop.innerHTML = "Stopped";
      state.textContent = "Starlight is stopped. Press Resume on the PC to let it go on.";
    }
  } catch (e) { state.textContent = "Starlight is not answering: the PC may be off or asleep."; }
}
stop.onclick = async () => {
  stop.disabled = true;
  try {
    await api("/api/kill", { method: "POST", body: {} });
    if (navigator.vibrate) navigator.vibrate(200);
    show();
  } catch (e) { state.textContent = "Could not reach Starlight: " + e.message; }
  finally { stop.disabled = false; }
};
show();
</script>
</body>
</html>
