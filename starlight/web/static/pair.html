<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#12162a" media="(prefers-color-scheme: dark)" />
<title>Pair with Starlight</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<link rel="stylesheet" href="/style.css" />
<script src="/i18n.js"></script>
<style>
  /* the Night Sky look: one card on the night ground, the star above the name; it is made for
     a phone first, so everything is full width and 44 px high */
  body { display: flex; align-items: flex-start; justify-content: center; padding: 12vh var(--s-4) var(--s-5); }
  .box { width: 100%; max-width: 400px; text-align: center; background: var(--panel); border: 1px solid var(--border);
         border-radius: var(--r-4); box-shadow: var(--shadow-1); padding: var(--s-5); }
  .box h1 { display: flex; align-items: center; justify-content: center; gap: var(--s-2); font-size: var(--fs-xl);
            font-weight: 600; margin: 0 0 var(--s-3); }
  .box h1 svg.ico { width: 28px; height: 28px; margin-right: 0; vertical-align: 0; }
  input { width: 100%; margin: var(--s-2) 0; text-align: center; min-height: 44px; }
  #code { font-size: 28px; letter-spacing: .3em; padding: 10px 8px 10px calc(8px + .3em);
          font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  button { width: 100%; min-height: 44px; margin-top: var(--s-2); }
</style>
</head>
<body>
<div class="box">
  <h1 data-icon="star">Starlight</h1>
  <p class="dim">This device isn't paired yet. On your PC, open Starlight's <b>Settings</b> and press
    <b>Show a pairing code</b> (or run <code>starlight remote pair</code>), then enter the code here.</p>
  <!-- 6 digits, as starlight/web/auth.py Devices.new_code makes them -->
  <input id="code" type="text" aria-label="Pairing code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" />
  <input id="name" type="text" placeholder="Name for this device (e.g. My phone)" aria-label="Name for this device" />
  <button id="go" class="primary">Pair</button>
  <p id="msg" class="dim small"></p>
</div>
<script src="/common.js"></script>
<script>
document.getElementById("name").value = /iPhone|iPad/.test(navigator.userAgent) ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android phone" : "Browser";
document.getElementById("go").onclick = async () => {
  const msg = document.getElementById("msg");
  try {
    await api("/api/pair", { method: "POST", body: { code: document.getElementById("code").value, name: document.getElementById("name").value } });
    msg.textContent = "Paired. Opening the chat…";
    location.href = "/";
  } catch (e) { msg.textContent = e.message; }
};
document.getElementById("code").onkeydown = (e) => { if (e.key === "Enter") document.getElementById("go").click(); };
</script>
</body>
</html>
