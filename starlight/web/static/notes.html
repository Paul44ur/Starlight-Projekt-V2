<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Starlight notes</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/style.css" />
<script src="/i18n.js"></script>
<style>
  /* Three areas: the list on the left, the note in the middle, what belongs to it on the right. */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .notes { flex: 1; min-height: 0; display: grid; grid-template-columns: 270px minmax(0, 1fr) 260px; }
  .side, .info { background: var(--panel); overflow-y: auto; padding: 12px 10px 40px; }
  .side { border-right: 1px solid var(--border); }
  .info { border-left: 1px solid var(--border); padding: 18px 14px 40px; }
  .side h3, .info h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
                       color: var(--dim); margin: 16px 6px 6px; font-weight: 600; }
  .info h3:first-child { margin-top: 0; }
  #search { width: 100%; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 10px; }
  .quick button, .item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
                         background: none; border: 1px solid transparent; border-radius: 7px;
                         padding: 5px 8px; color: var(--text); font-size: 14px; }
  .quick button:hover, .item:hover { background: var(--panel2); border-color: transparent; }
  .quick button.on, .item[aria-current="page"] { background: color-mix(in srgb, var(--accent) 16%, transparent);
                                                  color: var(--text); }
  .quick .ico { width: 1.2em; text-align: center; flex: none; }
  .item { overflow: hidden; }
  .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .count { margin-left: auto; color: var(--dim); font-size: 12px; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  details.folder > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px;
                             padding: 5px 8px; border-radius: 7px; font-size: 14px; font-weight: 600; }
  details.folder > summary::-webkit-details-marker { display: none; }
  details.folder > summary:hover { background: var(--panel2); }
  details.folder > summary::before { content: "▸"; color: var(--dim); font-size: 11px; width: 10px; }
  details.folder[open] > summary::before { content: "▾"; }
  details.folder > ul, details.folder > details { margin-left: 12px; }
  details.folder .empty { color: var(--dim); font-size: 13px; padding: 2px 8px 4px 26px; }

  /* The note: an easy-to-read column. */
  main.reading { overflow-y: auto; padding: 28px 32px 80px; outline: none; }
  .column { max-width: 760px; margin: 0 auto; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--dim); font-size: 13px; }
  .crumbs .actions { margin-left: auto; display: flex; gap: 4px; }
  .column h1.title { font-size: 30px; line-height: 1.25; margin: 6px 0 10px; letter-spacing: -.01em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
  .chip { font-size: 12.5px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 10px;
          background: var(--panel2); color: var(--dim); }
  .chip b { color: var(--text); font-weight: 600; }
  .reading .md { font-size: 16.5px; line-height: 1.7; }
  .reading .md h3 { font-size: 1.55em; } .reading .md h4 { font-size: 1.3em; }
  .reading .md h5 { font-size: 1.12em; } .reading .md h6 { font-size: 1em; }
  .reading .md .md-h { margin: 1.3em 0 .45em; scroll-margin-top: 16px; }
  .reading .md .md-h.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 25%, transparent); } to { background: transparent; } }
  .notice { border: 1px solid var(--warn); border-radius: 8px; padding: 8px 12px; margin: 0 0 14px; font-size: 14px; }

  /* Lists of notes (a search, a tag, a folder) and the start page. */
  .hello { text-align: center; padding: 60px 10px 20px; }
  .hello .big { font-size: 44px; line-height: 1; }
  .hello h1 { font-size: 24px; margin: 14px 0 6px; }
  .cards { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 8px; }
  .card-note { display: block; width: 100%; text-align: left; padding: 10px 14px; border-radius: 10px;
               background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  .card-note:hover { border-color: var(--accent); }
  .card-note .t { font-weight: 600; }
  .card-note .w { color: var(--dim); font-size: 12.5px; }
  .card-note .s { color: var(--dim); font-size: 13.5px; margin-top: 3px; }
  .soon { border: 1px dashed var(--border); border-radius: 12px; padding: 22px; color: var(--dim); text-align: center; }

  /* What belongs to the note. */
  .info ul.plain li button { display: block; width: 100%; text-align: left; background: none; border: none;
                             padding: 3px 6px; border-radius: 6px; color: var(--text); font-size: 13.5px; }
  .info ul.plain li button:hover { background: var(--panel2); }
  .info .lvl-2 { padding-left: 16px !important; } .info .lvl-3 { padding-left: 28px !important; }
  .info .lvl-4, .info .lvl-5, .info .lvl-6 { padding-left: 40px !important; }
  .info .back small { display: block; color: var(--dim); font-size: 12px; }
  .info dl { margin: 0; font-size: 13.5px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
  .info dt { color: var(--dim); } .info dd { margin: 0; overflow-wrap: anywhere; }
  .info .none { color: var(--dim); font-size: 13px; padding: 0 6px; }
  #info-toggle { display: none; }

  /* Finding a note: Ctrl+K. */
  .switcher { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: flex;
              justify-content: center; align-items: flex-start; padding-top: 12vh; }
  .switch-box { width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--border);
                border-radius: 12px; box-shadow: var(--shadow); padding: 10px; }
  .switch-box input { width: 100%; font-size: 16px; }
  .switch-box ul { list-style: none; margin: 8px 0 4px; padding: 0; max-height: 50vh; overflow-y: auto; }
  .switch-box li { padding: 7px 10px; border-radius: 7px; cursor: pointer; display: flex; gap: 8px; }
  .switch-box li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .switch-box li .w { margin-left: auto; color: var(--dim); font-size: 12.5px; }
  .switch-box .hint { margin: 4px 4px 0; }
  kbd { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--border); border-bottom-width: 2px;
        border-radius: 4px; padding: 0 4px; color: var(--dim); }

  @media (max-width: 1100px) {
    .notes { grid-template-columns: 250px minmax(0, 1fr); }
    .info { display: none; }
    #info-toggle { display: inline-block; }
    body.show-info .info { display: block; position: fixed; right: 0; top: 0; bottom: 0; width: 300px;
                           z-index: 30; box-shadow: var(--shadow); }
  }
  @media (max-width: 760px) {
    .notes { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .side { border-right: none; border-bottom: 1px solid var(--border); max-height: 38vh; }
    main.reading { padding: 18px 16px 60px; }
  }
</style>
</head>
<body>
<a class="skip" href="#note">Skip to the note</a>
<header class="top">
  <h1><img class="logo" src="/icon.svg" alt="" width="22" height="22" />Notes</h1><span class="spacer"></span>
  <nav><a href="/">Chat</a><a href="/memory">Memory</a><a href="/activity">Activity</a><a href="/automations">Automations</a><a href="/settings">Settings</a></nav>
  <button class="icon" id="find" title="Find a note (Ctrl+K)" aria-label="Find a note (Ctrl+K)">⌕ <kbd>Ctrl K</kbd></button>
  <button id="theme" class="icon" onclick="cycleTheme()" aria-label="Theme">◐</button>
</header>
<div class="notes">
  <aside class="side" aria-label="Your notes">
    <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" />
    <div class="quick" role="group" aria-label="Views">
      <button data-view="today"><span class="ico">📅</span>Today</button>
      <button data-view="inbox"><span class="ico">📥</span>Inbox</button>
      <button data-view="tasks"><span class="ico">☑</span>Tasks</button>
      <button data-view="graph"><span class="ico">✳</span>Graph</button>
    </div>
    <div id="pinned-box" hidden><h3>Pinned</h3><ul class="plain" id="pinned" translate="no"></ul></div>
    <h3>Folders</h3>
    <div id="folders" translate="no"></div>
  </aside>
  <main id="note" class="reading" tabindex="-1"><div class="column" id="column"></div></main>
  <aside class="info" id="info" aria-label="About this note">
    <h3>Outline</h3><ul class="plain" id="outline" translate="no"></ul>
    <h3>Linked from</h3><ul class="plain" id="backlinks" translate="no"></ul>
    <h3>Properties</h3><dl id="props" translate="no"></dl>
  </aside>
</div>
<div id="switcher" class="switcher" hidden role="dialog" aria-modal="true" aria-label="Find a note">
  <div class="switch-box">
    <input id="switch-input" autocomplete="off" placeholder="Type a note's name" aria-label="Type a note's name"
           role="combobox" aria-controls="switch-list" aria-expanded="true" />
    <ul id="switch-list" role="listbox" translate="no"></ul>
    <p class="dim small hint">↑↓ choose · Enter opens · Esc closes</p>
  </div>
</div>
<script src="/common.js"></script>
<script src="/markdown.js"></script>
<script src="/render.js"></script>
<script>
// The Notes page (docs/plan-notes-app.md, block B5): find and read your notes. Reading
// comes first; editing follows in a later update. Notes are your own text: it is drawn by
// markdown.js and render.js (only textContent) and never translated.
const RECENT = "starlight-notes-recent";
const state = { notes: [], folders: [], pinned: [], current: null };
const column = document.getElementById("column");
const t = (text) => (window.starlightTranslate ? window.starlightTranslate(text) : text);

function titleOf(note) { return note.title || note.name; }
function folderOf(path) { return path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : ""; }
function nameOf(path) { return path.slice(path.lastIndexOf("/") + 1).replace(/\.md$/i, ""); }
function when(seconds) {
  const date = new Date(seconds * 1000);
  return date.toLocaleDateString(window.starlightLanguage === "de" ? "de-DE" : undefined,
    { day: "numeric", month: "long", year: "numeric" });
}
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function recent() { try { return JSON.parse(localStorage.getItem(RECENT) || "[]"); } catch (e) { return []; } }
function remember(path) {
  try { localStorage.setItem(RECENT, JSON.stringify([path, ...recent().filter(p => p !== path)].slice(0, 12))); }
  catch (e) { /* a private window */ }
}

// -- the list on the left ------------------------------------------------------------------

async function loadList() {
  const data = await api("/api/notes");
  state.notes = data.notes; state.folders = data.folders; state.pinned = data.pinned;
  drawSide();
  if (data.capped) toast("Only the first 20,000 notes are listed");
}

function noteButton(note) {
  const b = el("button", "item");
  b.type = "button";
  b.dataset.path = note.path;
  b.title = note.path;
  b.appendChild(el("span", "name", titleOf(note)));
  b.onclick = () => go({ path: note.path });
  if (state.current && state.current.path === note.path) b.setAttribute("aria-current", "page");
  return b;
}

function drawSide() {
  const pinnedBox = document.getElementById("pinned-box");
  const pinned = document.getElementById("pinned");
  pinned.replaceChildren();
  for (const path of state.pinned) {
    const note = state.notes.find(n => n.path === path);
    if (note) pinned.appendChild(el("li")).appendChild(noteButton(note));
  }
  pinnedBox.hidden = !pinned.children.length;

  const tree = {};  // folder path -> notes
  for (const note of state.notes) (tree[folderOf(note.path)] ||= []).push(note);
  const folders = document.getElementById("folders");
  const open = new Set([...folders.querySelectorAll("details[open]")].map(d => d.dataset.folder));
  const first = !folders.children.length;
  folders.replaceChildren();
  const tops = [...state.folders, ...(tree[""] ? [""] : [])];
  for (const top of tops) folders.appendChild(folderBox(top, tree, open, first));
}

function folderBox(folder, tree, open, first) {
  const box = el("details", "folder");
  box.dataset.folder = folder;
  const inside = Object.keys(tree).filter(f => f === folder || f.startsWith(folder + "/"));
  const count = inside.reduce((n, f) => n + tree[f].length, 0);
  const current = state.current && (folderOf(state.current.path) + "/").startsWith(folder + "/");
  box.open = open.has(folder) || current || (first && folder === "Notes");
  const summary = el("summary");
  const label = el("span", "name", folder ? nameOf(folder) : t("Starlight folder"));
  if (!folder) label.removeAttribute("translate");
  summary.appendChild(label);
  summary.appendChild(el("span", "count", String(count)));
  box.appendChild(summary);
  const subfolders = [...new Set(inside.filter(f => f !== folder)
    .map(f => folder + "/" + f.slice(folder.length + 1).split("/")[0]))].sort();
  for (const sub of subfolders) box.appendChild(folderBox(sub, tree, open, false));
  const list = el("ul", "plain");
  const notes = [...(tree[folder] || [])];
  // the journal: the newest day first; elsewhere A to Z
  notes.sort((a, b) => folder === "Journal" ? b.name.localeCompare(a.name)
    : titleOf(a).localeCompare(titleOf(b), undefined, { sensitivity: "base" }));
  for (const note of notes) list.appendChild(el("li")).appendChild(noteButton(note));
  if (!count) box.appendChild(el("div", "empty", t("No notes here yet")));
  box.appendChild(list);
  return box;
}

function markCurrent() {
  document.querySelectorAll(".side .item").forEach(b => {
    if (state.current && b.dataset.path === state.current.path) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  document.querySelectorAll(".quick button").forEach(b => b.classList.toggle("on", b.dataset.view === state.view));
}

// -- moving around: /notes?path=… | ?open=Name&heading=… | ?tag=… | ?q=… | ?view=… --------

function go(params, push = true) {
  const query = new URLSearchParams(params).toString();
  if (push) history.pushState(params, "", "/notes" + (query ? "?" + query : ""));
  return route(params);
}

async function route(params) {
  state.view = params.view || null;
  if (params.path) return openNote(params.path, params.heading);
  if (params.open) {
    try {
      const found = await api("/api/notes/resolve?" + new URLSearchParams(
        { name: params.open, source: state.current ? state.current.path : "" }));
      const next = { path: found.path, ...(params.heading ? { heading: params.heading } : {}) };
      history.replaceState(next, "", "/notes?" + new URLSearchParams(next));
      return openNote(found.path, params.heading);
    } catch (e) {
      toast(t("There is no note called") + " " + params.open);
      return showHome();
    }
  }
  if (params.tag) return showList("#" + params.tag, "/api/notes?" + new URLSearchParams({ tag: params.tag }));
  if (params.q) return showSearch(params.q);
  if (params.view) return showView(params.view);
  return showHome();
}

window.addEventListener("popstate", () => route(Object.fromEntries(new URLSearchParams(location.search))));

// A link in a note: [[Other note]] and #tags stay on this page.
column.addEventListener("click", (event) => {
  const link = event.target.closest("a.note-link, a.tag");
  if (!link || event.ctrlKey || event.metaKey || event.shiftKey) return;
  const url = new URL(link.href, location.href);
  if (url.pathname !== "/notes") return;
  event.preventDefault();
  go(Object.fromEntries(url.searchParams));
});

// -- one note ------------------------------------------------------------------------------

async function openNote(path, heading) {
  let note;
  try { note = await api("/api/note?" + new URLSearchParams({ path })); }
  catch (e) { toast(e.message); return showHome(); }
  state.current = note;
  state.view = null;
  remember(note.path);
  document.title = note.title + " · Starlight";
  column.replaceChildren();
  const crumbs = column.appendChild(el("div", "crumbs"));
  crumbs.appendChild(el("span", "", folderOf(note.path) || t("Starlight folder")))
    .setAttribute("translate", folderOf(note.path) ? "no" : "yes");
  const info = (state.notes.find(n => n.path === note.path) || {});
  if (info.modified) crumbs.appendChild(el("span", "", "· " + t("changed") + " " + when(info.modified)));
  const actions = crumbs.appendChild(el("span", "actions"));
  const pin = el("button", "icon", note.pinned ? "★ Pinned" : "☆ Pin");
  pin.type = "button";
  pin.title = note.pinned ? t("Unpin this note") : t("Pin this note to the top of the list");
  pin.onclick = async () => {
    const answer = await api("/api/notes/pins", { method: "POST", body: { path: note.path, pinned: !note.pinned } });
    state.pinned = answer.pinned;
    note.pinned = !note.pinned;
    pin.textContent = t(note.pinned ? "★ Pinned" : "☆ Pin");
    drawSide();
  };
  const toggle = el("button", "icon", "ⓘ");
  toggle.id = "info-toggle"; toggle.type = "button";
  toggle.title = t("About this note"); toggle.setAttribute("aria-label", t("About this note"));
  toggle.onclick = () => document.body.classList.toggle("show-info");
  actions.append(pin, toggle);

  const title = column.appendChild(el("h1", "title", note.title));
  title.setAttribute("translate", "no");
  const chips = column.appendChild(el("div", "chips"));
  chips.setAttribute("translate", "no");
  // the note's own tags (its tags property); tags in the text show where they are written
  const own = note.properties.tags ?? note.properties.tag ?? [];
  const tags = (Array.isArray(own) ? own : String(own).split(/[\s,]+/))
    .map(tag => String(tag).replace(/^#/, "").trim()).filter(Boolean);
  for (const tag of tags) {
    const a = el("a", "tag", "#" + tag);
    a.href = "/notes?" + new URLSearchParams({ tag });
    a.onclick = (event) => { event.preventDefault(); go({ tag }); };
    chips.appendChild(a);
  }
  for (const [key, value] of Object.entries(note.properties)) {
    if (["tags", "tag", "aliases", "alias", "title"].includes(key)) continue;
    const chip = chips.appendChild(el("span", "chip"));
    chip.append(el("span", "", key + ": "), el("b", "", Array.isArray(value) ? value.join(", ") : String(value)));
  }
  chips.classList.add("md");  // (the tag pills' look)
  if (note.error) column.appendChild(el("p", "notice", t("This note's properties could not be read:") + " " + note.error));
  const body = column.appendChild(el("div", "md note-body"));
  body.setAttribute("translate", "no");
  renderMarkdown(body, note.body);
  if (!note.body.trim()) body.appendChild(el("p", "dim", t("This note is empty.")));

  drawInfo(note, body);
  markCurrent();
  document.getElementById("note").scrollTop = 0;
  if (heading) showHeading(body, note.headings, heading);
}

function showHeading(body, headings, wanted) {
  const name = wanted.split("#").pop().trim().toLowerCase();
  const index = headings.findIndex(h => h.text.toLowerCase() === name);
  const target = index >= 0 ? body.querySelectorAll(".md-h")[index] : null;
  if (!target) return;
  target.scrollIntoView({ block: "start" });
  target.classList.add("flash");
  setTimeout(() => target.classList.remove("flash"), 1300);
}

function drawInfo(note, body) {
  const outline = document.getElementById("outline");
  outline.replaceChildren();
  const rendered = body.querySelectorAll(".md-h");
  const top = Math.min(...note.headings.map(h => h.level), 6);
  note.headings.forEach((h, i) => {
    const b = el("button", "lvl-" + (h.level - top + 1), h.text || "…");
    b.type = "button";
    b.onclick = () => { if (rendered[i]) rendered[i].scrollIntoView({ block: "start", behavior: "smooth" }); };
    outline.appendChild(el("li")).appendChild(b);
  });
  if (!note.headings.length) outline.appendChild(el("li", "none", t("No headings")));

  const back = document.getElementById("backlinks");
  back.replaceChildren();
  const seen = new Set();
  for (const link of note.backlinks) {
    if (seen.has(link.from)) continue;
    seen.add(link.from);
    const b = el("button", "back", nameOf(link.from));
    b.type = "button";
    b.appendChild(el("small", "", folderOf(link.from)));
    b.onclick = () => go({ path: link.from });
    back.appendChild(el("li")).appendChild(b);
  }
  if (!seen.size) back.appendChild(el("li", "none", t("No other note links here yet")));

  const props = document.getElementById("props");
  props.replaceChildren();
  for (const [key, value] of Object.entries(note.properties)) {
    props.append(el("dt", "", key), el("dd", "", Array.isArray(value) ? value.join(", ") : String(value)));
  }
  if (!props.children.length) props.appendChild(el("dd", "none", t("None")));
}

// -- lists and the start page ----------------------------------------------------------------

function clearInfo() {
  state.current = null;
  ["outline", "backlinks", "props"].forEach(id => document.getElementById(id).replaceChildren());
  document.title = t("Starlight notes");
  markCurrent();
}

function card(path, snippet) {
  const note = state.notes.find(n => n.path === path);
  const b = el("button", "card-note");
  b.type = "button";
  b.setAttribute("translate", "no");
  b.appendChild(el("div", "t", note ? titleOf(note) : nameOf(path)));
  b.appendChild(el("div", "w", folderOf(path)));
  if (snippet) b.appendChild(el("div", "s", snippet));
  b.onclick = () => go({ path });
  return b;
}

function listOf(paths, snippets = {}) {
  const list = el("ul", "cards");
  for (const path of paths) list.appendChild(el("li")).appendChild(card(path, snippets[path]));
  return list;
}

async function showList(heading, url) {
  clearInfo();
  const data = await api(url);
  column.replaceChildren(el("h1", "title", heading));
  column.firstChild.setAttribute("translate", "no");
  column.appendChild(el("p", "dim", data.notes.length === 1 ? t("1 note") : data.notes.length + " " + t("notes")));
  column.appendChild(listOf(data.notes.map(n => n.path)));
}

async function showSearch(q) {
  clearInfo();
  document.getElementById("search").value = q;
  const data = await api("/api/notes/search?" + new URLSearchParams({ q }));
  column.replaceChildren(el("h1", "title", "“" + q + "”"));
  column.firstChild.setAttribute("translate", "no");
  if (!data.hits.length) {
    column.appendChild(el("p", "dim", t("Nothing found. Try fewer or other words.")));
    return;
  }
  column.appendChild(el("p", "dim", data.hits.length === 1 ? t("1 note") : data.hits.length + " " + t("notes")));
  column.appendChild(listOf(data.hits.map(h => h.path), Object.fromEntries(data.hits.map(h => [h.path, h.snippet]))));
}

function showHome() {
  clearInfo();
  const hello = el("div", "hello");
  hello.appendChild(el("div", "big", "🗒"));
  if (!state.notes.length) {
    hello.appendChild(el("h1", "", t("No notes yet")));
    hello.appendChild(el("p", "dim", t("Ask Starlight in the chat to write one, for example: “Make a note: buy milk”.")));
    column.replaceChildren(hello);
    return;
  }
  hello.appendChild(el("h1", "", t("Your notes")));
  hello.appendChild(el("p", "dim", t("Choose a note on the left, or press Ctrl+K to find one.")));
  column.replaceChildren(hello);
  const last = recent().filter(p => state.notes.some(n => n.path === p)).slice(0, 6);
  if (last.length) {
    column.appendChild(el("h3", "dim small", t("Opened lately")));
    column.appendChild(listOf(last));
  }
}

function showView(view) {
  if (view === "today") {
    const path = "Journal/" + today() + ".md";
    if (state.notes.some(n => n.path === path)) return go({ path }, false);
    clearInfo(); state.view = "today"; markCurrent();
    column.replaceChildren(el("h1", "title", t("Today")));
    column.appendChild(el("div", "soon", t("No journal entry for today yet. Tell Starlight in the chat: “Write in my journal: …”.")));
    return;
  }
  if (view === "inbox") {
    clearInfo(); state.view = "inbox"; markCurrent();
    column.replaceChildren(el("h1", "title", t("Inbox")));
    const inbox = state.notes.filter(n => folderOf(n.path) === "Inbox");
    if (!inbox.length) column.appendChild(el("div", "soon", t("The inbox is empty. Clipped pages and quick notes will land here.")));
    else column.appendChild(listOf(inbox.map(n => n.path)));
    return;
  }
  clearInfo(); state.view = view; markCurrent();
  column.replaceChildren(el("h1", "title", t(view === "tasks" ? "Tasks" : "Graph")));
  column.appendChild(el("div", "soon", t(view === "tasks"
    ? "All tasks from your notes in one place: coming in a later update."
    : "A map of how your notes link together: coming in a later update.")));
}

document.querySelectorAll(".quick button").forEach(b => b.onclick = () => go({ view: b.dataset.view }));

let searchTimer = null;
document.getElementById("search").addEventListener("input", (event) => {
  clearTimeout(searchTimer);
  const q = event.target.value.trim();
  searchTimer = setTimeout(() => (q ? go({ q }) : go({})), 250);
});

// -- finding a note: Ctrl+K -----------------------------------------------------------------

const switcher = document.getElementById("switcher");
const switchInput = document.getElementById("switch-input");
const switchList = document.getElementById("switch-list");
let choices = [], chosen = 0;

// How well "query" fits "text": every letter in order; a match at the start or at the start
// of a word counts more, and letters next to each other more still. -1: no match.
function fit(query, text) {
  const q = query.toLowerCase(), s = text.toLowerCase();
  let score = 0, at = -1, run = 0;
  for (const ch of q) {
    const next = s.indexOf(ch, at + 1);
    if (next < 0) return -1;
    run = next === at + 1 ? run + 1 : 0;
    score += 1 + run * 2 + (next === 0 || /[\s\-_/(]/.test(s[next - 1]) ? 3 : 0);
    at = next;
  }
  return score - s.length / 100;
}

function drawChoices() {
  const q = switchInput.value.trim();
  if (!q) {
    const last = recent().map(p => state.notes.find(n => n.path === p)).filter(Boolean);
    choices = [...last, ...state.notes.filter(n => !last.includes(n))].slice(0, 20).map(n => ({ note: n }));
  } else {
    choices = state.notes.map(n => {
      const names = [titleOf(n), n.name, ...n.aliases];
      const best = Math.max(...names.map(name => fit(q, name)));
      const alias = n.aliases.find(a => fit(q, a) === best && best > fit(q, titleOf(n)));
      return { note: n, score: best, alias };
    }).filter(c => c.score >= 0).sort((a, b) => b.score - a.score).slice(0, 20);
  }
  chosen = Math.min(chosen, Math.max(choices.length - 1, 0));
  switchList.replaceChildren();
  choices.forEach((c, i) => {
    const li = el("li");
    li.id = "choice-" + i;
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", String(i === chosen));
    li.appendChild(el("span", "", titleOf(c.note) + (c.alias ? " (" + c.alias + ")" : "")));
    li.appendChild(el("span", "w", folderOf(c.note.path)));
    li.onmousemove = () => { if (chosen !== i) { chosen = i; drawChoices(); } };
    li.onclick = () => pick(i);
    switchList.appendChild(li);
  });
  if (!choices.length) switchList.appendChild(el("li", "dim", t("No note with that name")));
  switchInput.setAttribute("aria-activedescendant", choices.length ? "choice-" + chosen : "");
}

function openSwitcher() {
  switcher.hidden = false;
  switchInput.value = "";
  chosen = 0;
  drawChoices();
  switchInput.focus();
}
function closeSwitcher() { switcher.hidden = true; }
function pick(i) {
  const choice = choices[i];
  closeSwitcher();
  if (choice) go({ path: choice.note.path });
}

switchInput.addEventListener("input", () => { chosen = 0; drawChoices(); });
switchInput.addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown") { chosen = Math.min(chosen + 1, choices.length - 1); drawChoices(); event.preventDefault(); }
  else if (event.key === "ArrowUp") { chosen = Math.max(chosen - 1, 0); drawChoices(); event.preventDefault(); }
  else if (event.key === "Enter") { pick(chosen); event.preventDefault(); }
  else if (event.key === "Escape") closeSwitcher();
});
switcher.addEventListener("click", (event) => { if (event.target === switcher) closeSwitcher(); });
document.getElementById("find").onclick = openSwitcher;
document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") { event.preventDefault(); openSwitcher(); }
  else if (event.key === "Escape" && document.body.classList.contains("show-info")) document.body.classList.remove("show-info");
});

// -- start ----------------------------------------------------------------------------------

(async () => {
  let welcome = null;
  try {
    welcome = (await api("/api/notes/welcome", { method: "POST", body: { lang: window.starlightLanguage || "en" } })).path;
    await loadList();
  } catch (e) {
    column.replaceChildren(el("p", "notice", e.message));
    return;
  }
  const params = Object.fromEntries(new URLSearchParams(location.search));
  if (welcome && !Object.keys(params).length) return go({ path: welcome }, false);
  history.replaceState(params, "", location.href);
  route(params);
})();
</script>
