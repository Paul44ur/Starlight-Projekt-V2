<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#171a21" />
<title>Starlight</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<link rel="stylesheet" href="/style.css" />
<style>
  body { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
  #convs { width: 260px; border-right: 1px solid var(--border); background: var(--panel);
           display: flex; flex-direction: column; }
  #convs .head { padding: 10px; display: flex; gap: 6px; }
  #convs input { flex: 1; min-width: 0; padding: 6px 8px; }
  #list { flex: 1; overflow-y: auto; padding: 0 6px 10px; }
  .conv { display: flex; align-items: center; gap: 4px; padding: 7px 8px; border-radius: 8px;
          cursor: pointer; font-size: 14px; }
  .conv:hover { background: var(--panel2); }
  .conv.active { background: var(--panel2); outline: 1px solid var(--border); }
  .conv .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .acts { display: none; }
  .conv:hover .acts, .conv.active .acts { display: flex; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  /* Never wider than the column: a long link or word wraps inside the bubble. */
  .msg { max-width: min(780px, 100%); min-width: 0; padding: 10px 14px; border-radius: 12px;
         white-space: pre-wrap; overflow-wrap: anywhere; position: relative; }
  .msg.you { align-self: flex-end; background: var(--you); }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.sys { align-self: center; color: var(--dim); font-size: 13px; background: none; padding: 2px; }
  .msg .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; text-transform: uppercase;
              letter-spacing: .04em; }
  .msg .tools { display: flex; gap: 4px; margin-top: 6px; }
  .msg .att { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .msg .thoughts { margin: 0 0 6px; font-size: 13px; color: var(--dim); }
  .msg .thoughts summary { cursor: pointer; user-select: none; width: fit-content; }
  .msg .thoughts .thought-text { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px;
    overflow: auto; border-left: 2px solid var(--border); padding: 4px 10px; margin-top: 4px; }
  /* Answers drawn from Markdown (markdown.js). */
  .msg .body.md { white-space: normal; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .6em; }
  .md .md-h { margin: .9em 0 .4em; line-height: 1.3; }
  .md h3 { font-size: 1.15em; } .md h4 { font-size: 1.05em; } .md h5, .md h6 { font-size: 1em; }
  .md ul, .md ol { margin: 0 0 .6em; padding-left: 1.5em; }
  .md li { margin: .15em 0; } .md li > p { margin: 0 0 .3em; }
  .md blockquote { margin: 0 0 .6em; padding: 2px 0 2px 12px; border-left: 3px solid var(--border);
                   color: var(--dim); }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: .8em 0; }
  .md a { color: var(--accent); }
  .md code { font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: .92em;
             background: var(--panel2); border-radius: 4px; padding: 1px 4px; }
  .md .md-code { margin: 0 0 .6em; border: 1px solid var(--border); border-radius: 8px;
                 overflow: hidden; }
  .md .md-code-bar { display: flex; justify-content: space-between; align-items: center;
                     font-size: 12px; color: var(--dim); background: var(--panel2); padding: 2px 4px 2px 10px; }
  .md pre { margin: 0; padding: 10px 12px; overflow-x: auto; background: var(--bg); }
  .md pre code { background: none; padding: 0; font-size: 13px; white-space: pre; }
  .md .md-table-wrap { overflow-x: auto; margin: 0 0 .6em; }
  .md table { width: auto; border-collapse: collapse; font-size: 14px; }
  .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; text-align: left;
                   vertical-align: top; }
  .md th { background: var(--panel2); color: var(--text); font-size: 14px; text-transform: none;
           letter-spacing: normal; }
  /* Before the first word: the model reads the prompt, or thinks (Qwen3, gpt-oss ...). */
  .msg .body.waiting:empty::before { content: attr(data-wait); color: var(--dim);
    animation: waiting 1.4s ease-in-out infinite; }
  @keyframes waiting { 50% { opacity: .35; } }
  /* /stars */
  .star { position: fixed; top: -1.5em; z-index: 60; pointer-events: none; color: #f8d56b;
          text-shadow: 0 0 8px rgba(248, 213, 107, .7); animation: starfall linear forwards; }
  @keyframes starfall { to { transform: translateY(110vh) rotate(540deg); opacity: .15; } }
  @media (prefers-reduced-motion: reduce) { .star { display: none; } }
  @media (prefers-reduced-motion: reduce) { .msg .body.waiting:empty::before { animation: none; } }
  .confirm { align-self: flex-start; max-width: min(780px, 100%); border: 1px solid var(--warn); border-radius: 12px;
             padding: 12px 14px; background: var(--panel); }
  .confirm .q { white-space: pre-wrap; margin-bottom: 10px; }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 14px
           calc(10px + env(safe-area-inset-bottom)); }
  #files { display: flex; gap: 6px; flex-wrap: wrap; max-width: 900px; margin: 0 auto 6px; }
  #files .pill { cursor: pointer; }
  #form { display: flex; gap: 8px; align-items: flex-end; max-width: 900px; margin: 0 auto; }
  #input { flex: 1; resize: none; min-height: 44px; max-height: 180px; padding: 10px 12px;
           border-radius: 10px; }
  #side { width: 260px; border-left: 1px solid var(--border); background: var(--panel); padding: 14px;
          overflow-y: auto; }
  #side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim);
             margin: 16px 0 6px; }
  #side .item { font-size: 13px; padding: 2px 0; word-break: break-all; }
  #drop { display: none; position: fixed; inset: 0; background: rgba(110,168,254,.15);
          border: 3px dashed var(--accent); z-index: 40; align-items: center; justify-content: center;
          font-size: 20px; }
  body.dragging #drop { display: flex; }
  #menu { display: none; }
  .narrow, .drawer-nav { display: none; }
  #kill.kill { color: var(--bad); border-color: var(--bad); background: none; }
  #kill.kill:hover { background: var(--bad); color: #fff; }
  #send.stop { color: #fff; background: #b3231d; border-color: #b3231d; }
  /* Regenerate only on the latest answer (only that one can be), and no buttons on an
     answer that has not begun. */
  .msg.bot .regen { display: none; }
  .msg.bot.latest .regen { display: inline-block; }
  .msg.bot:has(.body:empty) .tools { visibility: hidden; }
  #mic.on { color: var(--bad); border-color: var(--bad); }
  @media (max-width: 1100px) { #side { display: none; } }
  @media (max-width: 760px) {
    #menu { display: inline-block; }
    #convs { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; transform: translateX(-100%);
             transition: transform .2s; box-shadow: var(--shadow); }
    body.drawer #convs { transform: none; }
    #log { padding: 12px; }
    /* one row on a phone: the links and the theme are in the drawer (☰) */
    header.top { flex-wrap: nowrap; gap: 8px; }
    header.top .wide { display: none; }
    .narrow { display: inline; }
    .drawer-nav { display: flex; gap: 14px; align-items: center; padding: 12px 14px;
                  border-top: 1px solid var(--border); font-size: 14px; }
    #conn { width: 10px; height: 10px; padding: 0; font-size: 0; flex: none; }
  }
</style>
</head>
<body>
  <aside id="convs">
    <div class="head">
      <input id="search" type="search" placeholder="Search chats" />
      <button id="new" title="New conversation">＋</button>
      <button id="newprivate" title="New private conversation: never saved, nothing learned from it, gone when Starlight stops">🔒</button>
    </div>
    <div id="list"></div>
    <nav class="drawer-nav"><a href="/memory">Memory</a><a href="/activity">Activity</a><a href="/settings">Settings</a>
      <button class="icon" onclick="cycleTheme()" id="theme2" title="Theme">◐ Theme</button></nav>
  </aside>
  <div id="main">
    <header class="top">
      <button id="menu" class="icon" title="Conversations">☰</button>
      <h1><img class="logo" src="/icon.svg" alt="" width="22" height="22" />Starlight</h1>
      <span id="conn" class="pill off">connecting…</span>
      <span id="where" class="pill off" hidden></span>
      <button id="practice" class="pill warn" hidden title="Practice mode: actions that change something are described, not done. Press to turn it off"><span class="wide">practice mode · Off</span><span class="narrow">Practice</span></button>
      <span id="privacy" class="pill" hidden title="A private conversation: never saved, nothing is learned from it, and it is gone when Starlight stops">private</span>
      <button id="paused" class="pill warn" hidden title="Game mode: the model is off the graphics card. Press to bring it back now"><span class="wide">model paused · Resume</span><span class="narrow">Paused ▶</span></button>
      <span class="spacer"></span>
      <nav class="wide"><a href="/memory">Memory</a><a href="/activity">Activity</a><a href="/settings">Settings</a></nav>
      <button id="speaker" class="icon" title="Read answers aloud">🔇</button>
      <button id="theme" class="icon wide" title="Theme" onclick="cycleTheme()">◐</button>
      <button id="kill" class="kill" title="Kill switch: stop everything Starlight does on this PC, until you resume (also Ctrl+Alt+J)"><span class="wide">Kill switch</span><span class="narrow">Kill</span></button>
    </header>
    <div id="log"></div>
    <footer>
      <div id="files"></div>
      <form id="form">
        <button id="attach" type="button" class="icon" title="Add a picture or document">📎</button>
        <input id="picker" type="file" multiple hidden />
        <button id="mic" type="button" class="icon" title="Speak (press again to stop)">🎤</button>
        <textarea id="input" placeholder="Ask Starlight…  (Enter to send, Shift+Enter for a new line)"></textarea>
        <button id="send" class="ok" type="submit">Send</button>
      </form>
    </footer>
  </div>
  <aside id="side">
    <div><span class="pill" id="model">model: …</span></div>
    <h2>Allowed servers</h2><div id="servers" class="dim small">none</div>
    <h2>Logins</h2><div id="logins" class="dim small">none</div>
    <h2>Secrets</h2><div id="secrets" class="dim small">none</div>
    <h2>Saved files</h2><div id="saves" class="item"></div>
  </aside>
  <div id="drop">Drop pictures or documents to add them to your message</div>

<script src="/common.js"></script>
<script src="/markdown.js"></script>
<script>
const log = document.getElementById("log");
const input = document.getElementById("input");
// The full hint is too long for a phone: the placeholder would be cut off.
const HINT = "Ask Starlight…  (Enter to send, Shift+Enter for a new line)";
const narrow = matchMedia("(max-width: 760px)");
const idleHint = () => (narrow.matches ? "Ask Starlight…" : HINT);
input.placeholder = idleHint();
narrow.addEventListener("change", () => { if (!recorder) input.placeholder = idleHint(); });
const connPill = document.getElementById("conn");
let ws, current = null, conversation = null, lastQuestion = null, attached = [];
let answering = null, regenPending = false, resync = false;  // see handle() and connect()

function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }
function scroll() { log.scrollTop = log.scrollHeight; }

// Your messages show as you wrote them; answers are drawn from their Markdown (plain: a
// notice that is not the model's).
function addMsg(who, text, files, plain) {
  const stick = atBottom();
  const m = el("div", "msg " + (who === "you" ? "you" : "bot"));
  m.appendChild(el("div", "who", who === "you" ? "you" : "starlight"));
  const body = el("div", "body", who === "you" || plain ? text || "" : undefined);
  if (who !== "you" && !plain) setAnswer(body, text || "");
  m.appendChild(body);
  if (files && files.length) m.appendChild(el("div", "att", "📎 " + files.join(", ")));
  if (who !== "you") {
    const tools = el("div", "tools");
    const copy = el("button", "icon", "Copy");
    copy.onclick = () => navigator.clipboard.writeText(body.raw ?? body.textContent).then(() => toast("Copied"));
    const retry = el("button", "icon regen", "Regenerate");
    retry.title = "Ask the last message again and replace this answer";
    retry.onclick = () => regenerate(m);
    tools.append(copy, retry);
    m.appendChild(tools);
  }
  log.appendChild(m);
  markLatest();
  if (stick) scroll();
  return body;
}
function markLatest() {
  const answers = log.querySelectorAll(".msg.bot");
  answers.forEach((a, i) => a.classList.toggle("latest", i === answers.length - 1));
}
// Only the latest answer can be regenerated: it replaces that answer. An answer the server
// kept (or the old one it keeps after a failed regenerate) is asked again with "regenerate";
// one that failed or was stopped was never kept, so its question is simply asked again.
function regenerate(msg) {
  const answers = log.querySelectorAll(".msg.bot");
  if (msg !== answers[answers.length - 1]) { toast("Only the latest answer can be regenerated"); return; }
  if (current || answering) { toast("Wait until this answer is finished"); return; }
  if (!ws || ws.readyState !== 1) { toast("Not connected"); return; }
  let q = msg.previousElementSibling;
  while (q && !q.classList.contains("you")) q = q.previousElementSibling;
  const question = q ? q.querySelector(".body").textContent : "";
  if (msg.dataset.kept || msg.dataset.regen) {
    msg.remove(); markLatest(); regenPending = true;
    // The question tells the server which exchange is meant: another window may have
    // asked something since this page last showed the conversation.
    ws.send(JSON.stringify({ type: "regenerate", conversation, question }));
    return;
  }
  const text = question || lastQuestion;
  if (!text) { toast("Nothing to ask again"); return; }
  msg.remove(); markLatest();
  asking = true; syncSend();
  ws.send(JSON.stringify({ type: "ask", text, conversation }));
}
// An answer's text (body.raw), drawn at once; while it streams in, at most once a frame.
function setAnswer(body, text) {
  body.raw = text;
  body.classList.add("md");
  renderMarkdown(body, text);
}
function addToAnswer(body, text) {
  body.raw = (body.raw || "") + text;
  body.classList.add("md");
  if (body.drawing) return;
  body.drawing = true;
  requestAnimationFrame(() => {
    body.drawing = false;
    const stick = atBottom();
    renderMarkdown(body, body.raw);
    if (stick) scroll();
  });
}
function addStats(body, stats) {
  if (!stats || !stats.seconds) return;
  const parts = [];
  if (stats.tokens_per_second) parts.push(stats.tokens_per_second + " tok/s");
  parts.push(stats.seconds + " s");
  body.parentElement.appendChild(el("div", "att", parts.join(" · ")));
}
function addSys(text) { const stick = atBottom(); log.appendChild(el("div", "msg sys", text)); if (stick) scroll(); }

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => {
    connPill.textContent = "connected"; connPill.className = "pill on";
    if (resync && conversation) open(conversation);  // an answer that was replaced is shown again
    resync = false;
  };
  ws.onclose = () => {
    connPill.textContent = "offline"; connPill.className = "pill off";
    // The server drops the answer in progress and the questions it was waiting on with the
    // socket: forget them here too, or Regenerate would wait for an answer that never ends.
    if (current || answering) addSys("Connection lost: the answer was interrupted.");
    if (regenPending) resync = true;
    doneWaiting(current);
    current = null; answering = null; regenPending = false; asking = false; syncSend();
    log.querySelectorAll(".confirm").forEach(card => card.remove());
    setTimeout(connect, 1500);
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (["start", "busy", "error", "stopped", "answer"].includes(m.type)) asking = false;
    handle(m);
    syncSend();
  };
}

// Until the first word arrives the answer shows that Starlight is at work, and after a few
// seconds for how long (a model that thinks first can take a minute).
function waitFor(body) {
  const started = Date.now();
  body.classList.add("waiting");
  body.dataset.wait = "…";
  const timer = setInterval(() => {
    if (!body.isConnected || !body.classList.contains("waiting")) { clearInterval(timer); return; }
    const seconds = Math.round((Date.now() - started) / 1000);
    if (seconds >= 3) body.dataset.wait = `Working on it … ${seconds} s`;
  }, 1000);
}
function doneWaiting(body) { if (body) { body.classList.remove("waiting"); thoughtsDone(body); } }

// The model's thinking while it comes, folded away above the answer: open it to read
// along. Only as text, never HTML; it is not kept with the conversation.
function addThought(body, text) {
  let box = body.thoughts;
  if (!box) {
    box = body.thoughts = el("details", "thoughts");
    box.appendChild(el("summary", "", "Thinking …"));
    box.text = box.appendChild(el("div", "thought-text"));
    box.started = Date.now();
    body.parentElement.insertBefore(box, body);
  }
  const stick = atBottom();
  box.text.textContent += text;
  if (box.open) box.text.scrollTop = box.text.scrollHeight;
  if (stick) scroll();
}
function thoughtsDone(body) {
  const box = body.thoughts;
  if (!box || box.done) return;
  box.done = true;
  const seconds = Math.max(1, Math.round((Date.now() - box.started) / 1000));
  box.firstChild.textContent = `Thought for ${seconds} s`;
}

// The conversation an answer is coming for: if you open another one meanwhile, its words
// are not shown there (open the first one again to see the answer).
function elsewhere(m) { return answering && answering !== conversation; }
function handle(m) {
  if (m.type === "start") {
    if (!conversation) conversation = m.conversation;
    answering = m.conversation || conversation;
    current = addMsg("bot", "");
    waitFor(current);
    if (regenPending) current.parentElement.dataset.regen = "1";
  }
  else if (m.type === "thought") {
    if (elsewhere(m)) return;
    if (!current) { current = addMsg("bot", ""); waitFor(current); }
    addThought(current, m.text);
  }
  else if (m.type === "token") {
    if (elsewhere(m)) return;
    if (!current) current = addMsg("bot", ""); doneWaiting(current);
    addToAnswer(current, m.text);
  }
  else if (m.type === "answer" && elsewhere(m)) { answering = null; regenPending = false; current = null; loadList(); }
  else if (m.type === "answer") {
    // The final answer replaces what streamed in: it is the cleaned one (a reply cut
    // where the model started repeating itself may have streamed a little too far).
    if (m.text || !current) setAnswer(current || (current = addMsg("bot", "")), m.text);
    doneWaiting(current);
    addStats(current, m.stats);
    if (!m.stopped && !m.failed) current.parentElement.dataset.kept = "1";
    else if (regenPending) current.parentElement.dataset.regen = "1";  // the old answer stays
    if (m.stopped) addSys("Kill switch engaged. Press Resume on the PC to continue.");
    else if (speakAnswers) say(markdownToSpeech(m.text));
    current = null; answering = null; regenPending = false; loadList();
  }
  else if ((m.type === "stopped" || m.type === "error") && regenPending && !current) {
    // Asking again did not even start: the earlier answer stays, so show it again.
    regenPending = false; answering = null;
    toast(m.type === "stopped" ? "Stopped; the earlier answer stays" : m.text);
    if (conversation) open(conversation);
  }
  else if (m.type === "stopped") {
    doneWaiting(current);
    if (!elsewhere(m)) addSys("[stopped]");
    current = null; answering = null; regenPending = false;
  }
  else if (m.type === "error") {
    doneWaiting(current);
    if (!elsewhere(m)) {
      const b = addMsg("bot", "⚠ " + m.text, null, true); b.style.color = "var(--bad)";
      if (regenPending) b.parentElement.dataset.regen = "1";
    }
    current = null; answering = null; regenPending = false;
  }
  else if (m.type === "notify") { addSys("ℹ " + m.text); }
  else if (m.type === "busy") {
    addSys("Starlight is still working on the last message.");
    if (regenPending) { regenPending = false; if (conversation) open(conversation); }  // show the old answer again
  }
  else if (m.type === "confirm") { showConfirm(m); }
  else if (m.type === "prompt") { showPrompt(m); }
}

function showConfirm(m) {
  const stick = atBottom();
  const card = el("div", "confirm");
  card.appendChild(el("div", "q", m.question));
  const row = el("div", "row");
  const yes = el("button", "ok", "Approve");
  const no = el("button", "", "Deny");
  yes.onclick = () => { ws.send(JSON.stringify({ type: "reply", id: m.id, value: "yes" })); card.remove(); };
  no.onclick = () => { ws.send(JSON.stringify({ type: "reply", id: m.id, value: "no" })); card.remove(); };
  row.append(yes, no); card.appendChild(row);
  log.appendChild(card); if (stick) scroll();
}
function showPrompt(m) {
  const stick = atBottom();
  const card = el("div", "confirm");
  card.appendChild(el("div", "q", m.question));
  const box = document.createElement("input");
  box.type = m.secret ? "password" : "text"; box.style.cssText = "width:100%;margin-bottom:8px";
  const send = el("button", "ok", "Send");
  const go = () => { ws.send(JSON.stringify({ type: "reply", id: m.id, value: box.value })); card.remove(); };
  send.onclick = go; box.onkeydown = (e) => { if (e.key === "Enter") go(); };
  card.append(box, send); log.appendChild(card); if (stick) scroll(); box.focus();
}

function ask(text, files) {
  if (!ws || ws.readyState !== 1) { toast("Not connected yet"); return; }
  lastQuestion = text;
  asking = true; syncSend();
  addMsg("you", text, files.map(f => f.name));
  ws.send(JSON.stringify({ type: "ask", text, conversation, attachments: files.map(f => f.id) }));
}

// Typing /stars: a little starfall, here in the page (nothing is sent to the model).
function starfall() {
  for (let i = 0; i < 48; i++) {
    const star = el("div", "star", "✦✧⋆★"[i % 4]);
    star.style.left = Math.random() * 100 + "vw";
    star.style.fontSize = 10 + Math.random() * 24 + "px";
    star.style.animationDuration = 2.2 + Math.random() * 2.4 + "s";
    star.style.animationDelay = Math.random() * 1.4 + "s";
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 6500);
  }
}

document.getElementById("form").onsubmit = (e) => {
  e.preventDefault();
  if (busy()) { stopAnswer(); return; }
  const text = input.value.trim();
  if (!text) return;
  if (text === "/stars") { input.value = ""; starfall(); return; }
  const files = attached; attached = []; showFiles();
  input.value = ""; input.style.height = "44px";
  ask(text, files);
};
input.onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    // Enter never stops an answer (you may be typing the next question): that is Esc or Stop.
    if (busy()) toast("Starlight is still answering: Esc or Stop ends it");
    else document.getElementById("form").requestSubmit();
  }
  else if (e.key === "ArrowUp" && !input.value) {
    // Up in an empty box brings back the last question, to change it or send it again.
    const asked = log.querySelectorAll(".msg.you .body");
    const last = lastQuestion || (asked.length ? asked[asked.length - 1].textContent : "");
    if (!last) return;
    e.preventDefault();
    input.value = last; input.oninput();
    input.setSelectionRange(last.length, last.length);
  }
};
input.oninput = () => { input.style.height = "44px"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; };
function stopAnswer() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "stop" })); }
// While an answer is being written, the Send button stops it.
let asking = false;  // a question was sent and its answer has not begun yet
function busy() { return Boolean(asking || current || answering); }
function syncSend() {
  const b = document.getElementById("send");
  b.textContent = busy() ? "Stop" : "Send";
  b.className = busy() ? "stop" : "ok";
  b.title = busy() ? "Stop this answer (Esc)" : "Send (Enter)";
}
// Esc stops the answer that is being written (as the Stop button does).
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && (current || answering) && !e.target.closest(".confirm")) {
    e.preventDefault(); stopAnswer(); toast("Stopping …");
  }
});
document.getElementById("practice").onclick = async () => {
  if (!confirm("Leave practice mode? Actions will run for real again.")) return;
  try { await api("/api/practice", { method: "POST", body: { on: false } }); toast("Practice mode is off"); }
  catch (e) { toast("Turn it off at the PC: " + e.message); }
  refresh();
};
document.getElementById("paused").onclick = async () => {
  try {
    const r = await api("/api/model/resume", { method: "POST" });
    toast(r.resumed ? "The model is loading again (about a minute)" : "It was not paused");
  } catch (e) { toast("Could not resume: " + e.message); }
  refresh();
};
document.getElementById("kill").onclick = async () => {
  const k = document.getElementById("kill");
  try { await api(k.dataset.on === "1" ? "/api/resume" : "/api/kill", { method: "POST" }); }

// -- files ---------------------------------------------------------------------------------
async function upload(file) {
  const response = await fetch("/api/upload", { method: "POST", headers: { "X-Filename": encodeURIComponent(file.name) }, body: file });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) { toast(data.detail || "Could not add " + file.name); return; }
  attached.push({ id: data.id, name: data.name });
  showFiles();
}
function showFiles() {
  const box = document.getElementById("files"); box.innerHTML = "";
  attached.forEach((f, i) => {
    const p = el("span", "pill", "📎 " + f.name + " ✕");
    p.title = "Remove"; p.onclick = () => { attached.splice(i, 1); showFiles(); };
    box.appendChild(p);
  });
}
const picker = document.getElementById("picker");
document.getElementById("attach").onclick = () => picker.click();
picker.onchange = () => { [...picker.files].forEach(upload); picker.value = ""; };
let dragDepth = 0;
window.addEventListener("dragenter", (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) { dragDepth++; document.body.classList.add("dragging"); } });
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove("dragging"); });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging"); [...(e.dataTransfer.files || [])].forEach(upload); });
input.addEventListener("paste", (e) => { [...(e.clipboardData.files || [])].forEach(upload); });

// -- voice -----------------------------------------------------------------------------------
let speakAnswers = false, recorder = null;
try { speakAnswers = localStorage.getItem("starlight-speak") === "1"; } catch (e) { /* */ }
function showSpeaker() { document.getElementById("speaker").textContent = speakAnswers ? "🔊" : "🔇"; }
document.getElementById("speaker").onclick = () => {
  speakAnswers = !speakAnswers; showSpeaker();
  try { localStorage.setItem("starlight-speak", speakAnswers ? "1" : "0"); } catch (e) { /* */ }
};
async function say(text) {
  try {
    const response = await fetch("/api/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    if (!response.ok) { const d = await response.json().catch(() => ({})); toast(d.detail || "Could not speak"); return; }
    new Audio(URL.createObjectURL(await response.blob())).play();
  } catch (e) { toast("Could not speak"); }
}
// Record 16 kHz mono 16-bit WAV in the browser, which the speech server reads directly.
async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const context = new AudioContext();
  const source = context.createMediaStreamSource(stream);
  const node = context.createScriptProcessor(4096, 1, 1);
  const chunks = [];
  node.onaudioprocess = (e) => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  source.connect(node); node.connect(context.destination);
  return { stop: async () => {
    node.disconnect(); source.disconnect(); stream.getTracks().forEach(t => t.stop());
    const rate = context.sampleRate; await context.close();
    return wav(chunks, rate);
  } };
}
function wav(chunks, rate) {
  const all = new Float32Array(chunks.reduce((n, c) => n + c.length, 0));
  let at = 0; chunks.forEach(c => { all.set(c, at); at += c.length; });
  const ratio = rate / 16000, length = Math.floor(all.length / ratio);
  const buffer = new ArrayBuffer(44 + length * 2), view = new DataView(buffer);
  const text = (o, s) => [...s].forEach((ch, i) => view.setUint8(o + i, ch.charCodeAt(0)));
  text(0, "RIFF"); view.setUint32(4, 36 + length * 2, true); text(8, "WAVEfmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, 16000, true); view.setUint32(28, 32000, true); view.setUint16(32, 2, true);
  view.setUint16(34, 16, true); text(36, "data"); view.setUint32(40, length * 2, true);
  for (let i = 0; i < length; i++) {
    const v = Math.max(-1, Math.min(1, all[Math.floor(i * ratio)]));
    view.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
  }
  return new Blob([buffer], { type: "audio/wav" });
}
document.getElementById("mic").onclick = async () => {
  const mic = document.getElementById("mic");
  if (!recorder) {
    if (!navigator.mediaDevices) { toast("The microphone needs https:// or this PC"); return; }
    try { recorder = await startRecording(); mic.classList.add("on"); }
    catch (e) { toast("No microphone access: " + e.message); }
    return;
  }
  mic.classList.remove("on");
  const audio = await recorder.stop(); recorder = null;
  input.placeholder = "Listening…";
  try {
    const response = await fetch("/api/transcribe", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: audio });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) { toast(data.detail || "Could not understand that"); return; }
    input.value = (input.value ? input.value + " " : "") + (data.text || "");
    input.focus(); input.oninput();
  } finally { input.placeholder = idleHint(); }
};
showSpeaker();

// -- conversations ---------------------------------------------------------------------------
async function loadList() {
  const search = document.getElementById("search").value;
  let data;
  try { data = await api("/api/conversations?search=" + encodeURIComponent(search)); } catch (e) { return; }
  if (!conversation) conversation = data.current;
  const list = document.getElementById("list"); list.innerHTML = "";
  data.conversations.forEach(c => {
    const row = el("div", "conv" + (c.id === conversation ? " active" : ""));
    const t = el("span", "t", (c.private ? "🔒 " : "") + c.title); t.title = c.title + " — " + c.updated.replace("T", " ").slice(0, 16);
    const acts = el("span", "acts");
    const ren = el("button", "icon", "✎"); ren.title = "Rename";
    ren.onclick = async (e) => { e.stopPropagation(); const title = prompt("New name", c.title); if (title) { await api("/api/conversations/" + c.id, { method: "PATCH", body: { title } }); loadList(); } };
    const del = el("button", "icon", "🗑"); del.title = "Delete";
    del.onclick = async (e) => { e.stopPropagation(); if (confirm("Delete \"" + c.title + "\"?")) { await api("/api/conversations/" + c.id, { method: "DELETE" }); if (c.id === conversation) { const d = await api("/api/conversations", { method: "POST" }); await open(d.id); } else loadList(); } };
    const exp = el("button", "icon", "⤓"); exp.title = "Download as a Markdown file";
    exp.onclick = (e) => {
      e.stopPropagation();
      const a = document.createElement("a");
      a.href = "/api/conversations/" + c.id + "/export"; a.download = "";
      document.body.appendChild(a); a.click(); a.remove();
    };
    acts.append(ren, exp, del); row.append(t, acts);
    row.onclick = () => open(c.id);
    list.appendChild(row);
  });
}
async function open(id) {
  document.body.classList.remove("drawer");
  let data;
  try { data = await api("/api/conversations/" + id); } catch (e) { toast(e.message); return; }
  conversation = id; log.innerHTML = ""; current = null;
  document.getElementById("privacy").hidden = !data.private;
  data.messages.forEach(m => {
    const body = addMsg(m.role === "user" ? "you" : "bot", m.content);
    if (m.role !== "user") body.parentElement.dataset.kept = "1";
  });
  if (!data.messages.length) addSys(data.private
    ? "Private conversation: it is never saved and nothing is learned from it. It is gone when Starlight stops."
    : "New conversation. Ask anything.");
  loadList(); scroll();
}
document.getElementById("new").onclick = async () => { const d = await api("/api/conversations", { method: "POST" }); await open(d.id); input.focus(); };
document.getElementById("newprivate").onclick = async () => { const d = await api("/api/conversations", { method: "POST", body: { private: true } }); await open(d.id); input.focus(); };
document.getElementById("search").oninput = () => loadList();
document.getElementById("menu").onclick = () => document.body.classList.toggle("drawer");
log.addEventListener("click", () => document.body.classList.remove("drawer"));

// -- status ----------------------------------------------------------------------------------
async function refresh() {
  try {
    const s = await api("/api/status");
    document.getElementById("model").textContent = "model: " + s.model;
    const where = document.getElementById("where");
    if (!s.local) { where.hidden = false; where.textContent = s.device || "remote"; }
    const k = document.getElementById("kill");
    if (s.kill.engaged) {
      k.textContent = "Resume"; k.className = "ok"; k.dataset.on = "1"; k.disabled = !s.local;
      k.title = s.local ? "The kill switch is on: Starlight does nothing until you resume"
                        : "Release the kill switch on the PC";
    } else if (k.dataset.on !== "0") {
      k.replaceChildren(el("span", "wide", "Kill switch"), el("span", "narrow", "Kill"));
      k.className = "kill"; k.dataset.on = "0"; k.disabled = false;
      k.title = "Kill switch: stop everything Starlight does on this PC, until you resume (also Ctrl+Alt+J)";
    }
    document.getElementById("practice").hidden = !s.practice;
    const paused = document.getElementById("paused");
    paused.hidden = !s.paused;
    if (s.paused) paused.title = `Game mode (${s.paused}): the model is off the graphics card. Press to bring it back now`;
    fill("servers", s.access.servers || []); fill("logins", s.access.login_sites || []); fill("secrets", s.access.secrets || []);
    document.getElementById("saves").textContent = s.saves_files || "";
  } catch (e) { /* server starting */ }
}
function fill(id, items) {
  const box = document.getElementById(id); box.innerHTML = "";
  if (!items.length) { box.className = "dim small"; box.textContent = "none"; return; }
  box.className = ""; items.forEach(x => box.appendChild(el("div", "item", x)));
}

(async () => {
  await loadList();
  if (conversation) await open(conversation);
  connect(); refresh(); setInterval(refresh, 4000);
})();
