# Starlight V2 global configuration. Validated on start-up (starlight/core/config.py).
name: Starlight

logging:
  level: INFO
  max_bytes: 5000000   # rotate each log file at ~5 MB
  backups: 5

agent:
  max_steps: 15
  # Each request also gets the date and time, where saved files go and the user's
  # profile (starlight/core/situation.py), plus memories and skills that fit.
  system_prompt: |-
    You are Starlight, a private assistant that runs on the user's own PC. Be brief and direct.
    - When a tool can do the job or check a fact, use it. Never guess what a tool would return, and never say you did something you did not do.
    - Use calc for any arithmetic, unit conversion or date calculation.
    - If none of the tools you see fits, call tools.find with what you need.
    - Don't talk about your tools, and never write the user's part of the conversation; end your reply when you have answered.
    - When the user wants something you made as a file, or wants to keep it, save it with files.save and say where it is.
    - If a request is unclear, or could delete or send something the user may not want, ask one short question first.
    - After using tools, say in a sentence what you did and what came of it.
    - Answer in the user's language: the one in their profile, otherwise the one they write in.
  # Only the tools that fit a request are sent to the model (fewer tokens, faster
  # answers, better picks); tools.find brings in more. false: always send every tool.
  tool_routing: true
  max_tools: 40           # at most this many tools per request
  max_tool_modules: 6     # tools of at most this many best-fitting modules

# --- Step 4: the local model -------------------------------------------------------
# "echo" is a built-in test stand-in so everything runs without a model.
# For your RX 9060 XT (16 GB), use one of the blocks below. See docs/setup-windows.md.
model:
  provider: echo
  options: {}
  context_window: 32768   # tokens; older turns are summarized beyond this
  reserve_tokens: 4096    # kept free for the answer
  keep_recent: 8          # recent messages never summarized
  stream: true            # answers appear while they are generated
  warmup: true            # load the model into VRAM at start-up

# LM Studio (it loads and runs the model; turn on its local server in the Developer tab).
# Starlight.exe --lmstudio writes this for you:
#
# model:
#   provider: lmstudio
#   options:
#     base_url: http://127.0.0.1:1234/v1
#     model: auto        # the language model loaded in LM Studio, or its exact name
#   context_window: 32768  # load the model in LM Studio with at least this context length
#
# Ollama (simplest):
#
# model:
#   provider: ollama
#   options:
#     model: qwen2.5:14b-instruct-q4_K_M   # ~9 GB + ~3 GB q8 KV cache at 32k
#     keep_alive: -1                        # never unload between requests
#     num_gpu: 999                          # every layer on the GPU
#   server:
#     flash_attention: true
#     kv_cache_type: q8_0
#
# llama.cpp (llama-server, Vulkan build for AMD on Windows):
#
# model:
#   provider: llamacpp
#   options:
#     base_url: http://127.0.0.1:8080/v1
#   server:
#     binary: C:/llama.cpp/llama-server.exe
#     model_path: C:/models/Qwen2.5-14B-Instruct-Q4_K_M.gguf
#
# Small fast model for simple requests, large one for reasoning:
#
# model:
#   provider: router
#   options:
#     fast: {provider: ollama, options: {model: "qwen2.5:3b-instruct"}}
#     main: {provider: ollama, options: {model: "qwen2.5:14b-instruct-q4_K_M"}}

# Specialised models by role. Without an entry, the main model does the work.
roles: {}
#  code:      # Step 9: code is written by a coding-tuned model
#    provider: ollama
#    options: {model: "qwen2.5-coder:14b-instruct-q4_K_M"}
#  vision:    # Step 8: describe_screen / locate (or set it in config/modules/desktop.yaml)
#    provider: ollama
#    options: {model: "qwen2.5vl:7b"}

# --- Step 5: memory ----------------------------------------------------------------
memory:
  enabled: true
  embedder:
    provider: hash        # built in, matches shared words. On the GPU via Ollama:
    # provider: ollama    #   ollama pull nomic-embed-text   (finds meaning, not just words)
    # model: nomic-embed-text
    # provider: lmstudio  # or LM Studio's own embedding model (its local server must be on)
  top_k: 5                # memories added to each prompt
  min_score: 0.2
  merge_threshold: 0.92   # this similar to an existing memory = update it, not a new file
  auto_extract: true      # after each task the model picks what is worth keeping

# --- Files Starlight makes for you ---------------------------------------------------
output:
  # Letters, notes, tables and code Starlight saves (modules/files and modules/code).
  # Empty: a "Starlight" folder in your Documents. A full path such as D:/Starlight files
  # works too, but never Starlight's own folder.
  folder: ""
  # New files may be saved in any folder without asking; replacing or adding to a file
  # outside the Starlight folder, and reading one, still ask. false: saving elsewhere asks.
  write_anywhere: true

# --- Step 6: polite web access, shared by every module ------------------------------
http:
  max_requests_per_second: 10  # in any one-second window, across all modules
  per_domain_interval: 0.5     # seconds between requests to the same site (its crawl-delay wins)
  respect_robots: true
  cache_ttl: 3600              # seconds a fetched page is reused
  max_retries: 3               # on HTTP 429 / 503, honouring Retry-After

# --- Step 9: skills ------------------------------------------------------------------
skills:
  enabled: true
  auto_draft: true       # a task that succeeds again the same way becomes a draft skill
  repeat_threshold: 2
  max_in_prompt: 2       # approved skills added to a matching prompt

# --- Step 10: statistics ------------------------------------------------------------
stats:
  retention_days: 30
  gpu_sample_interval: 30   # seconds; 0 = off
viewer:
  host: 127.0.0.1
  port: 8765
  refresh_seconds: 5

# The web chat (starlight web). Local only: it runs the assistant, keep it off the network.
web:
  host: 127.0.0.1
  port: 8700

kill_switch:
  hotkey: "<ctrl>+<alt>+j"   # emergency stop, works anywhere; needs the "hotkey" extra (pynput)
  stop_file: data/STOP
  poll_interval: 0.2

permissions:
  # Glob patterns on tool names such as "hello.*" or "web.login".
  # auto_approve: run without asking; confirm: always ask; blocked: never run.
  # Example: let Starlight type and click without asking, but never run SSH commands:
  #   auto_approve: ["desktop.*"]
  #   blocked: ["network.ssh_run"]
  #
  # These run without asking (each tool's own default is to ask first). A web page or an
  # email the model reads could try to talk it into one of them, and nothing stops to
  # ask; the kill switch (Ctrl+Alt+J) and the logs remain. Delete a line to get its
  # question back.
  auto_approve:
    - "desktop.*"               # click, type, press keys, scroll, launch apps (red banner stays)
    - code.run_python           # still in the sandbox: no network, not Starlight's folder
    - code.write_code
    - apps.close                # unsaved work in that program can be lost
    - system.close_app
    - network.http_request      # HTTP, SSH commands, TCP and WebSocket messages to servers
    - network.ssh_run
    - network.tcp_send
    - network.websocket_send
    - mail.send                 # mail.draft_reply still shows a draft first if you ask for one
    - mail.reply
  # Still asking (not listed above): any command line (commands.shell, shows the exact
  # command each time), shutdown/restart/sleep, replacing or reading files outside the
  # Starlight folder, granting access (access.*, always asks).
  confirm: []
  blocked: []
  # The injection guard: once a request has read outside content (the tools below: web
  # pages, mail, PDFs, the screen ...), the tools above that normally ask ask again for
  # the rest of that request, with a note saying why. Hidden text in a page or an email
  # cannot then send mail or type for you unnoticed. false: they never ask.
  guard_after_untrusted: true
  untrusted_sources:
    - "web.*"
    - news.headlines
    - "research.*"
    - "transcripts.*"
    - mail.inbox
    - mail.read
    - mail.unread
    - mail.summary
    - login.open
    - network.http_get
    - network.http_request
    - pdf.read_pdf
    - "office.read_*"
    - desktop.read_screen
    - desktop.describe_screen
    - watch.check_now

tools:
  timeout: 120   # seconds before a tool call is aborted
  max_result_chars: 12000   # longer tool results are cut before the model sees them
