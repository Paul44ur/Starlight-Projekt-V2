# The commands module (modules/commands): your own named commands, plus any command line
# with commands.shell (below). Add a named command from the chat ("add a command
# 'backup-photos' that runs ...") or here:
#
# commands:
#   backup-photos:
#     run: ["robocopy", "D:\\Photos", "E:\\Backup\\Photos", "/MIR"]
#     description: Mirror my photos to the backup drive
#     ask: true          # false: runs without asking each time
#     timeout: 600
#   restart-game-server:
#     run: ["powershell", "-File", "C:\\scripts\\restart.ps1", "{name}"]   # {name}: an argument
#     description: Restart a game server by name
max_output: 8000   # characters of output kept
# commands.shell: any command line (PowerShell on Windows). It asks before every command
# and shows it to you; false switches it off entirely.
shell: true
shell_timeout: 300 # seconds a command line may run at most
commands: {}
