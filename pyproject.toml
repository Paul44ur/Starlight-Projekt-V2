[project]
name = "starlight"
version = "0.1.0"
description = "Starlight V2: a local, modular AI assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "httpx>=0.27",
    "keyring>=25.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "structlog>=24.1",
    "tzdata>=2024.1; sys_platform == 'win32'",  # time zones for calendars on Windows
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Global kill-switch hotkey (Ctrl+Alt+K). Works on Windows and Linux desktops.
hotkey = ["pynput>=1.7"]
# Step 6: pages that need JavaScript, and logins
browser = ["playwright>=1.48"]
# Step 7: SSH and WebSocket
network = ["asyncssh>=2.14", "websockets>=13.0"]
# Step 8: screen reading and input emulation
desktop = [
    "mss>=9.0",
    "pillow>=10.0",
    "pynput>=1.7",
    "pytesseract>=0.3.10",
    "uiautomation>=2.0.18; sys_platform == 'win32'",
]
# Richer system info (CPU/RAM/battery/processes). Falls back to the standard library.
system = ["psutil>=5.9"]
# Reading and writing PDF files (the pdf module). Without it, the pdf module says so.
pdf = ["pypdf>=4.0", "reportlab>=4.0"]
# Word and Excel files (the office module). Without it, the office module says so.
office = ["python-docx>=1.1", "openpyxl>=3.1"]
# YouTube captions (the transcripts module). Without it, the transcripts module says so.
transcripts = ["youtube-transcript-api>=1.0"]
# Recording from the microphone (the voice module's `listen` and the terminal's /talk).
voice = ["sounddevice>=0.4"]
all = ["starlight[hotkey,browser,network,desktop,system,pdf,office,transcripts,voice]"]

[project.scripts]
starlight = "starlight.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starlight"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["starlight"]

[[tool.mypy.overrides]]
module = ["pynput", "pynput.*", "mss", "mss.*", "pytesseract", "uiautomation", "keyring", "keyring.*", "psutil", "pypdf", "pypdf.*", "reportlab", "reportlab.*", "docx", "docx.*", "openpyxl", "openpyxl.*", "youtube_transcript_api", "youtube_transcript_api.*", "sounddevice"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
